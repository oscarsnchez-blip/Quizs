<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211c4c"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest?v=17"><title>Quiz en familia</title><link rel="stylesheet" href="style.css?v=17"></head><body><main><section id="home"><h1>Quiz en familia</h1><p>Elige un quiz</p><div id="shows"><button data-show="friends"><img src="friends.webp"><b>Friends</b></button><button data-show="stranger"><img src="stranger.webp"><b>Stranger Things</b></button><button data-show="patrulla"><img src="patrulla.webp"><b>La Patrulla Canina</b></button><button data-show="aitana"><img src="aitana.webp"><b>Aitana</b></button></div></section><section id="setup" hidden><div class="setup-hero"><img id="setup-cover" alt=""><button class="back" type="button" aria-label="Volver al inicio"><span aria-hidden="true">‹</span><b>Volver</b></button><div class="hero-shade"></div></div><div class="setup-content"><h2 id="title"></h2><div class="setup-card"><p class="section-label">Dificultad</p><div id="diff" class="segmented"><button type="button" data-d="Fácil">Fácil</button><button type="button" data-d="Media">Media</button><button type="button" data-d="Difícil">Difícil</button></div></div><div class="setup-card"><p class="section-label">Modo de juego</p><div id="mode" class="segmented mode"><button type="button" data-m="solo"><span class="option-icon">●</span><span>Individual</span></button><button type="button" data-m="duel"><span class="option-icon">●●</span><span>1 contra 1</span></button></div><div class="players"><input id="p1" placeholder="Nombre del jugador 1"><input id="p2" placeholder="Nombre del jugador 2" hidden></div></div><div class="setup-card categories-card"><div class="section-heading"><p class="section-label">Categorías</p><button id="toggle-all" type="button">Desmarcar todas</button></div><div id="blocks"></div></div><div class="question-summary"><span id="available"></span></div><div class="setup-card"><p class="section-label">Número de preguntas</p><div id="counts" class="segmented"><button type="button" data-c="10">10</button><button type="button" data-c="20">20</button><button type="button" data-c="30">30</button></div></div><button id="start" type="button"><span>Empezar partida</span><span aria-hidden="true">→</span></button></div></section><section id="game" hidden><p><span id="turn"></span> · <span id="progress"></span></p><img id="cover"><h2 id="question"></h2><div id="answers"></div><p id="feedback"></p><button id="next" hidden>Siguiente</button></section><section id="result" hidden><h1 id="winner"></h1><div id="scores"></div><button id="again">Repetir</button><button id="other">Otro quiz</button></section></main><script src="friends.js?v=17"></script><script src="stranger.js?v=17"></script><script src="patrulla.js?v=17"></script><script src="aitana.js?v=17"></script><script src="app.js?v=17"></script><script>navigator.serviceWorker?.register('./sw.js?v=17')</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#211c4c"><title>Quiz en familia</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section id="catalog" class="screen active"><header class="home-head"><span class="eyebrow">QUIZ EN FAMILIA</span><h1>¿A qué jugamos?</h1><p>Elige una serie, la dificultad y juega en solitario o 1 contra 1.</p></header><div class="cards"><button class="quiz-card" data-show="friends"><img src="friends.webp" alt="Ilustración de apartamento y cafetería"><span><b>Friends</b><small>Preguntas por escenas y temporadas</small></span></button><button class="quiz-card dark" data-show="stranger"><img src="stranger.webp" alt="Ilustración de bicicletas y misterio sobrenatural"><span><b>Stranger Things</b><small>Preguntas por escenas y temporadas</small></span></button><button class="quiz-card paw" data-show="patrulla"><img src="patrulla.webp" alt="Ilustración de cachorros de rescate"><span><b>La Patrulla Canina</b><small>Preguntas por escenas y temporadas</small></span></button></div><p class="legal">Quiz privado no oficial. Ilustraciones originales.</p></section>
<section id="setup" class="screen"><header class="bar"><button class="back" data-go="catalog">‹</button><h2 id="setupTitle"></h2></header><img id="setupImg" class="cover" alt="Portada del quiz"><div class="sheet"><label>Dificultad</label><div id="diffs" class="three"><button data-diff="Fácil" class="choice selected">Fácil</button><button data-diff="Media" class="choice">Media</button><button data-diff="Difícil" class="choice">Difícil</button></div><label>Modo</label><div id="modes" class="two"><button data-mode="solo" class="choice selected">👤 Individual</button><button data-mode="versus" class="choice">⚔️ 1 contra 1</button></div><div id="names"><input id="p1" placeholder="Jugador 1"><input id="p2" class="hidden" placeholder="Jugador 2"></div><label>Bloques</label><div id="blocks" class="blocks"></div><div class="links"><button id="all">Todos</button><button id="none">Limpiar</button></div><label>Partida</label><div id="lengths" class="three"><button data-count="10" class="choice selected">10</button><button data-count="20" class="choice">20</button><button data-count="30" class="choice">30</button></div><p id="available"></p><button id="start" class="primary">Empezar</button><p id="err" class="error"></p></div></section>
<section id="game" class="screen"><header class="gamebar"><button class="back" id="quit">×</button><div><div class="meta"><span id="turn"></span><span id="progress"></span></div><div class="track"><i id="fill"></i></div></div></header><img id="gameImg" class="gameimg" alt="Imagen del quiz"><div class="sheet qsheet"><div class="badges"><span id="blockBadge"></span><span id="difficultyBadge"></span></div><div id="scores" class="scores"></div><h2 id="question"></h2><div id="answers" class="answers"></div><p id="feedback" class="feedback"></p><button id="next" class="primary hidden">Siguiente</button></div></section>
<section id="results" class="screen"><img id="resultImg" class="resultimg" alt="Resultado"><div class="sheet result"><div class="trophy">🏆</div><h1 id="resultTitle"></h1><p id="resultText"></p><div id="finalScores" class="finalscores"></div><button id="again" class="primary">Repetir partida</button><button class="secondary" data-go="catalog">Elegir otro quiz</button></div></section></main><script src="friends.js"></script><script src="stranger.js"></script><script src="patrulla.js"></script><script src="app.js"></script></body></html>
